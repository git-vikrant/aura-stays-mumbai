version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aura-stays-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=aura_production_jwt_secret_key_2026_super_secure!
      - JWT_REFRESH_SECRET=aura_production_jwt_refresh_secret_2026!
      - CLIENT_URL=http://localhost:5173
      - EXCHANGE_RATE_USD_TO_INR=84
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/prisma

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: aura-stays-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  uploads_data:
  db_data:
