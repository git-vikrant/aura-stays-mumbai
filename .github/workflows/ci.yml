name: Aura Stays CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci_pipeline_secret_jwt_key_2026_test!"
      JWT_REFRESH_SECRET: "ci_pipeline_refresh_secret_2026_test!"
      CLIENT_URL: "http://localhost:5173"
      EXCHANGE_RATE_USD_TO_INR: 84

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Server Dependencies
        working-directory: server
        run: npm ci

      - name: Initialize Prisma Database & Run Migrations
        working-directory: server
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run Data Hygiene & 14-Property Seeding Pipeline
        working-directory: server
        run: node src/data/seed.js

      - name: Run Unit & API Integration Tests
        working-directory: server
        run: npm test

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build Frontend Production Bundle
        working-directory: client
        run: npm run build

      - name: Verify No Secrets Committed
        run: |
          if grep -rn "ghp_" . || grep -rn "BEGIN RSA PRIVATE KEY" .; then
            echo "Secret exposure detected!"
            exit 1
          fi
          echo "Secret scan passed cleanly."
